<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="noteGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3A0"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>

  <!-- back note -->
  <rect x="118" y="120" width="290" height="290" rx="14"
        fill="#FDE68A" stroke="#D97706" stroke-width="4"
        transform="rotate(-9 263 265)"/>

  <!-- front note -->
  <g filter="url(#soft)">
    <rect x="108" y="136" width="300" height="300" rx="16"
          fill="url(#noteGrad)" stroke="#B45309" stroke-width="4"
          transform="rotate(4 258 286)"/>
  </g>

  <!-- text lines suggestion on the note -->
  <g transform="rotate(4 258 286)" opacity="0.35">
    <rect x="148" y="196" width="200" height="14" rx="7" fill="#92400E"/>
    <rect x="148" y="228" width="150" height="14" rx="7" fill="#92400E"/>
  </g>

  <!-- "Stickies" word across the note -->
  <g transform="rotate(4 258 286)">
    <text x="258" y="330" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif" font-weight="700"
          font-size="58" fill="#7C2D12">Stickies</text>
  </g>

  <!-- pushpin -->
  <g transform="translate(300 92)">
    <ellipse cx="0" cy="46" rx="14" ry="6" fill="#000000" opacity="0.15"/>
    <line x1="0" y1="8" x2="0" y2="40" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="26" fill="#EF4444"/>
    <circle cx="-8" cy="-9" r="7" fill="#FCA5A5" opacity="0.85"/>
  </g>
</svg>
